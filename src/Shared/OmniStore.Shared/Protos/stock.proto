syntax = "proto3";

option csharp_namespace = "OmniStore.Shared.Protos";

package stock;

// =============================================================================
// ARCHITECTURE NOTE: High-Concurrency Stock Reservation Contract
// Used for Synchronous low-latency gRPC calls during checkout.
// "Sync Reserve" ensures stock is temporarily held before payment is executed.
// =============================================================================

service InventoryProtoService {
  // Synchronous atomic stock reservation
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);

  // Synchronous reservation release (if payment aborts immediately)
  rpc ReleaseStockReservation (ReleaseStockReservationRequest) returns (ReleaseStockReservationResponse);
}

message StockItemRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string order_id = 1;
  repeated StockItemRequest items = 2;
  int32 ttl_seconds = 3; // Time-to-live for reservation hold (e.g. 900 seconds)
}

message ReserveStockResponse {
  bool is_success = 1;
  string reservation_id = 2;
  string error_message = 3;
}

message ReleaseStockReservationRequest {
  string reservation_id = 1;
  string order_id = 2;
}

message ReleaseStockReservationResponse {
  bool is_success = 1;
  string message = 2;
}
